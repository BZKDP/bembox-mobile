name: bembox
description: "bembox — гипер-локальная доставка за 15 минут"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.5+6

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.3.0
  dio: ^5.9.2
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  url_launcher: ^6.3.2
  package_info_plus: ^10.1.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  collection: ^1.19.1
  image_picker: ^1.1.2   # загрузка фото QR/штрих-кода на экране ПВЗ
  flutter_svg: ^2.0.10+1 # фон-сцена «луг» на экране воды (meadow.svg с прода)
  webview_flutter: ^4.10.0 # legacy виджет оплаты ЮKassa — оставлен для совместимости
  geolocator: ^13.0.2    # нативное гео-разрешение + позиция для карты адреса
  flutter_inappwebview: ^6.1.5 # ЯДРО оболочки: full-screen WebView поверх bembox.ru
  connectivity_plus: ^6.1.0    # детект офлайна → экран «нет интернета»
  permission_handler: ^11.3.1  # нативный запрос разрешений (камера/гео) до WebView
  flutter_rustore_push: ^6.10.0 # пуши через RuStore (без Google-сервисов, для RuStore)
  firebase_core: ^3.6.0      # инициализация Firebase (FCM для Google Play + iOS)
  firebase_messaging: ^15.1.3 # пуши через FCM (iOS + Android с Google Play Services)

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  flutter_launcher_icons: ^0.14.1 # генерация иконок приложения из логотипа bembox
  flutter_native_splash: ^2.4.6 # нативный сплеш (Android 12 Splash API) — без мигания на холодном старте

# Иконка приложения: коралловая «b» из коробок. Адаптивная (Android) — на
# бежевом фоне бренда #FFFCF6; iOS — на том же фоне (без альфы).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#FFFCF6"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  # Монохромный слой для themed-иконок Android 13+ (система перекрашивает силуэт
  # «b» под цвет темы рабочего стола). Берём тот же padded-силуэт, что и foreground.
  adaptive_icon_monochrome: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
  background_color_ios: "#FFFCF6"

# Нативный сплеш bembox: брендовый бежевый фон + коралловый лого-знак по центру.
# Закрывает «миг белого» на холодном старте до инициализации Flutter-движка
# (Android 12+ Splash Screen API + легаси-сплеш для старых версий).
flutter_native_splash:
  color: "#FFFCF6"
  image: assets/brand/logo-mark.png
  android_12:
    image: assets/icon/icon_foreground.png
    icon_background_color: "#FFFCF6"
    color: "#FFFCF6"
  android: true
  ios: true
  fullscreen: false

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # ── Ассеты ───────────────────────────────────────────────────────────────
  # Бренд-картинки (логотипы, иконки) кладём сюда. Картинки товаров грузятся по
  # сети (cached_network_image) с публичных URL — их в ассеты НЕ кладём.
  assets:
    - assets/onboarding/ # иллюстрации экранов нативного онбординга
    - assets/brand/
    - assets/home/        # маскот героя главной
    - assets/illu-v5/     # 3D-иллюстрации услуг (кофе/вода/мусор/…)
    - assets/promo/       # картинки промо-карусели
    - assets/trash-v2/    # 3D-помощник с пакетами для экрана выноса мусора
    - assets/coffee/      # сцена-фон и стаканы для экрана кофе
    - assets/breakfast/   # дизайн-карточки блюд для экрана завтраков
    - assets/water/       # бутыли (очищенная/минеральная) для экрана воды
    - assets/pvz/         # hero-фон экрана пункта выдачи
    - assets/marketplaces/ # лого маркетплейсов для выбора в ПВЗ

  # ── Шрифты ───────────────────────────────────────────────────────────────
  # Сайт использует Manrope (грузит из Google Fonts). Мы бандлим его в приложение,
  # чтобы (1) текст был «1 в 1» как на сайте и (2) не зависеть от сети при старте.
  # Файл — вариативный (variable) TTF: одна ось `wght`, Flutter подбирает нужную
  # насыщенность по FontWeight автоматически.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf

  # (старые комментарии шаблона ниже сохранены для справки)
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
